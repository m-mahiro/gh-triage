name: Auto Fix on CI Failure

on:
  workflow_run:
    workflows: ["CI"]     # ↑のCIワークフロー名と一致させる
    types: [completed]
    branches: [main]      # mainへのプッシュのみ対象（PRは無視）

jobs:
  request-copilot-fix:
    # Copilot自身のコミットで再発火しないようにする
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login != 'copilot-swe-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create issue and assign to Copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 CI失敗の自動修正依頼 (${{ github.event.workflow_run.head_sha }})`,
              body: [
                '## CI失敗を検知しました',
                '',
                `- **コミット**: \`${{ github.event.workflow_run.head_sha }}\``,
                `- **失敗したrun**: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}`,
                '',
                '上記のCI失敗を調査し、修正PRを作成してください。',
              ].join('\n'),
              assignees: ['copilot'],
            });
